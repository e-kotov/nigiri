# [fork-ci-only] CI for pull requests on the e-kotov/nigiri fork, on GitHub-hosted
# runners only (the upstream Linux matrix needs self-hosted runners the fork does not
# have). Drop this file / commit before proposing the change upstream.
name: fork-ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    runs-on: ubuntu-latest
    container: ghcr.io/motis-project/docker-cpp-build
    steps:
      - uses: actions/checkout@v4
      - name: clang-format-21 (include, src, test)
        run: |
          git config --global --add safe.directory "$PWD"
          find include src test -type f \( -name '*.cc' -o -name '*.h' \) -print0 | xargs -0 clang-format-21 -i
          git diff --stat
          git diff --exit-code

  build-and-test:
    runs-on: ubuntu-latest
    container: ghcr.io/motis-project/docker-cpp-build
    timeout-minutes: 330
    env:
      # pkg clones dependencies via git@github.com URLs; use HTTPS on hosted runners
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: "url.https://github.com/.insteadOf"
      GIT_CONFIG_VALUE_0: "git@github.com:"
    steps:
      - uses: actions/checkout@v4
      - name: Runner resources
        run: nproc; free -g; df -h . /
      - name: CMake (linux-amd64-release)
        run: |
          git config --global --add safe.directory '*'
          cmake -G Ninja -S . -B build --preset=linux-amd64-release
      - name: Build nigiri-test
        run: cmake --build build --target nigiri-test --parallel "$(nproc)"
      - name: one_to_all tests (incl. cross-direction state reuse)
        run: build/nigiri-test --gtest_filter='one_to_all.*'
      - name: All nigiri tests
        run: build/nigiri-test
